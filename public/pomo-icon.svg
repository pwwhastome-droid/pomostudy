<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Arc Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5376" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Core Glow -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Tile (Squircle) -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="266" r="170" fill="#f43f5e" fill-opacity="0.28" filter="url(#coreGlow)" />

  <!-- Outer Track Ring (Subtle Base) -->
  <circle cx="256" cy="266" r="152" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="26" />

  <!-- Main Focus Arc (Bold Glowing 270-degree Stroke) -->
  <circle cx="256" cy="266" r="152" fill="none" stroke="url(#arcGrad)" stroke-width="26" stroke-linecap="round" stroke-dasharray="715 250" transform="rotate(-90 256 266)" />

  <!-- Organic Emerald Leaf Accent -->
  <g transform="translate(348, 125) rotate(42)">
    <rect x="-18" y="-42" width="36" height="84" rx="18" fill="url(#leafGrad)" />
    <rect x="-8" y="-22" width="16" height="44" rx="8" fill="#a7f3d0" />
  </g>

  <!-- Center Hub -->
  <circle cx="256" cy="266" r="28" fill="#ffffff" />
  <circle cx="256" cy="266" r="12" fill="#0b0f1a" />

  <!-- Precision Clock Hands -->
  <!-- Minute Hand (2 o'clock / forward tilt) -->
  <line x1="256" y1="266" x2="336" y2="204" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <!-- Hour Hand (12 o'clock) -->
  <line x1="256" y1="266" x2="256" y2="196" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
</svg>
