<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Tomato 3D Sphere Radial Gradient -->
    <radialGradient id="tomatoSphere" cx="38%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="25%" stop-color="#fb7185" />
      <stop offset="55%" stop-color="#f43f5e" />
      <stop offset="85%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>

    <!-- Ambient Shadow/Glow -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Tile (Squircle) -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="285" r="160" fill="#f43f5e" fill-opacity="0.32" filter="url(#ambientGlow)" />

  <!-- Tomato Main Body -->
  <circle cx="256" cy="285" r="145" fill="url(#tomatoSphere)" />

  <!-- Dial Track (Focus Arc) -->
  <circle cx="256" cy="285" r="88" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="9" stroke-linecap="round" stroke-dasharray="415 150" />

  <!-- Center Pin & Hands -->
  <circle cx="256" cy="285" r="12" fill="#ffffff" />
  <circle cx="256" cy="285" r="5" fill="#e11d48" />

  <!-- Minute Hand (Pointing ~2 o'clock) -->
  <line x1="256" y1="285" x2="315" y2="238" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <!-- Hour Hand (Pointing ~10 o'clock) -->
  <line x1="256" y1="285" x2="216" y2="248" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />

  <!-- Stem & Calyx Leaves -->
  <!-- Left Leaf -->
  <path d="M 256 142 C 205 130 165 145 155 152 C 175 168 220 162 256 148 Z" fill="#059669" />
  <!-- Right Leaf -->
  <path d="M 256 142 C 295 110 345 116 360 125 C 342 148 298 155 256 148 Z" fill="url(#leafGrad)" />
  <!-- Curved Stem -->
  <path d="M 256 144 C 252 118 266 98 288 88" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" />
  <!-- Calyx Cap -->
  <circle cx="256" cy="144" r="12" fill="#047857" />
</svg>
